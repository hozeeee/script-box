name: Script Hub

on:
  push:
    branches: [main, master]
    paths:
      - 'script-hub/**'
      - .github/workflows/script-hub.yml
  pull_request:
    paths:
      - 'script-hub/**'
      - .github/workflows/script-hub.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: script-hub
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: script-hub/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: script-hub/pnpm-lock.yaml
      - name: 安装子项目依赖
        run: pnpm install --frozen-lockfile
      - name: 检查代码
        run: pnpm lint
      - name: 构建并测试脚本与网站
        run: pnpm test
      - name: 上传静态网站产物
        uses: actions/upload-artifact@v7
        with:
          name: script-hub-site
          path: script-hub/dist/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: 部署脚本中心到 GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: script-hub-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 下载已验证的网站产物
        uses: actions/download-artifact@v4
        with:
          name: script-hub-site
          path: script-hub-site
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上传 Pages 部署产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: script-hub-site
      - name: 部署 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
