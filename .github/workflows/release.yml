name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
          - os: macos-latest
            platform: --mac
          - os: ubuntu-latest
            platform: --linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Optional code signing. Without these secrets the app is published unsigned,
      # and auto update on macOS is not guaranteed to work.
      # Missing secrets expand to empty strings, and electron-builder treats an empty
      # CSC_LINK as a path (the working directory), so only export the ones that are set.
      - name: Configure code signing
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            if [ -n "${!name}" ]; then
              echo "$name<<__EOF__" >> "$GITHUB_ENV"
              echo "${!name}" >> "$GITHUB_ENV"
              echo "__EOF__" >> "$GITHUB_ENV"
            fi
          done
          if [ -z "$CSC_LINK" ]; then
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi

      - name: Package and publish
        run: pnpm exec electron-builder ${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  script-hub:
    name: 构建脚本中心发布包
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: script-hub
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: script-hub/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: script-hub/pnpm-lock.yaml
      - name: 安装子项目依赖
        run: pnpm install --frozen-lockfile
      - name: 检查代码
        run: pnpm lint
      - name: 构建并测试脚本与网站
        run: pnpm test
      - name: 打包完整网站与单文件脚本
        working-directory: script-hub/dist
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: zip -r "${RUNNER_TEMP}/script-hub-${RELEASE_TAG#v}.zip" .
      - name: 保存脚本中心发布包
        uses: actions/upload-artifact@v4
        with:
          name: script-hub-release
          path: ${{ runner.temp }}/script-hub-*.zip
          if-no-files-found: error
          retention-days: 14

  publish-script-hub:
    name: 上传脚本中心到 Release
    needs: [release, script-hub]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 下载脚本中心发布包
        uses: actions/download-artifact@v4
        with:
          name: script-hub-release
          path: script-hub-release
      # 等桌面应用创建好对应 Release，避免并行创建草稿的竞争。
      - name: 上传到同一标签的 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" "script-hub-release/script-hub-${RELEASE_TAG#v}.zip" --clobber
