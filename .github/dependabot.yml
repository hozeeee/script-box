version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      eslint:
        patterns: ['eslint*', '@antfu/eslint-config', '@eslint-react/*']
      react:
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
      electron-build:
        patterns: [electron-vite, electron-builder, electron-updater]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
