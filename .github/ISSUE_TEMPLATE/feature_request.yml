name: Feature request / 功能建议
description: Suggest an idea for Script Box / 为 Script Box 提出新想法
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / 要解决的问题
      description: What problem would this feature solve? / 这个功能要解决什么问题？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution / 建议的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 其他方案
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution / 贡献
      options:
        - label: I am willing to submit a pull request / 我愿意提交 PR
